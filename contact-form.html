<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        :root {
            /* Light theme colors */
            --background: hsl(0, 0%, 100%);
            --foreground: hsl(222, 84%, 5%);
            --primary: hsl(214, 84%, 56%);
            --primary-hover: hsl(214, 84%, 48%);
            --primary-foreground: hsl(0, 0%, 100%);
            --form-background: hsl(0, 0%, 100%);
            --form-border: hsl(214, 31%, 91%);
            --form-border-focus: hsl(214, 84%, 56%);
            --form-input: hsl(0, 0%, 100%);
            --form-label: hsl(215, 16%, 47%);
            --success: hsl(142, 71%, 45%);
            --success-background: hsl(142, 71%, 95%);
            --destructive: hsl(0, 84%, 60%);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: hsl(222, 84%, 5%);
                --foreground: hsl(210, 40%, 98%);
                --form-background: hsl(222, 84%, 5%);
                --form-border: hsl(217, 33%, 18%);
                --form-input: hsl(217, 33%, 18%);
                --form-label: hsl(215, 20%, 65%);
                --success-background: hsl(142, 71%, 15%);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            min-height: 100vh;
            padding: 3rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 1.25rem;
            color: var(--form-label);
            max-width: 32rem;
            margin: 0 auto;
        }

        .form-card {
            background: var(--form-background);
            border: 1px solid var(--form-border);
            border-radius: 0.75rem;
            box-shadow: var(--shadow-lg);
            max-width: 42rem;
            margin: 0 auto;
            overflow: hidden;
        }

        .form-header {
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--form-border);
        }

        .form-header h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .form-header p {
            font-size: 1.125rem;
            color: var(--form-label);
        }

        .form-content {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--form-label);
            margin-bottom: 0.5rem;
        }

        .character-count {
            font-size: 0.75rem;
            color: var(--form-label);
            font-weight: normal;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--form-input);
            border: 1px solid var(--form-border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--form-border-focus);
            box-shadow: 0 0 0 3px hsl(214, 84%, 56%, 0.1);
        }

        .form-input.error,
        .form-textarea.error {
            border-color: var(--destructive);
        }

        .form-input.error:focus,
        .form-textarea.error:focus {
            border-color: var(--destructive);
            box-shadow: 0 0 0 3px hsl(0, 84%, 60%, 0.1);
        }

        .form-textarea {
            min-height: 7.5rem;
            resize: vertical;
        }

        .error-message {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: var(--destructive);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .error-message.show {
            display: flex;
        }

        .error-icon {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
        }

        .submit-button {
            width: 100%;
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .submit-button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .submit-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px hsl(214, 84%, 56%, 0.3);
            transform: scale(1.02);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid transparent;
            border-top: 2px solid var(--primary-foreground);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        .submit-button.loading .loading-spinner {
            display: inline-block;
        }

        .submit-button.loading .button-text {
            display: none;
        }

        .submit-button.loading .loading-text {
            display: inline;
        }

        .loading-text {
            display: none;
        }

        .success-message {
            display: none;
            background: var(--success-background);
            border: 1px solid var(--success);
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            max-width: 42rem;
            margin: 0 auto;
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            width: 4rem;
            height: 4rem;
            color: var(--success);
            margin: 0 auto 1rem;
        }

        .success-message h3 {
            color: var(--success);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .success-message p {
            color: var(--form-label);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 2.25rem;
            }

            .header p {
                font-size: 1.125rem;
            }

            .form-content {
                padding: 1.5rem;
            }

            .form-header {
                padding: 1.5rem 1.5rem 1rem;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }

            .form-header p {
                font-size: 1rem;
            }
        }

        /* Hide/show form and success message */
        .form-card.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Contact Us</h1>
            <p>Have a question or want to work together? We'd love to hear from you.</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <svg class="success-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3>Message Sent Successfully!</h3>
            <p>Thank you for your message. We'll get back to you soon.</p>
        </div>

        <!-- Contact Form -->
        <div class="form-card" id="formCard">
            <div class="form-header">
                <h2>Get In Touch</h2>
                <p>We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
            </div>
            <div class="form-content">
                <form id="contactForm" novalidate>
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name *</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            class="form-input" 
                            placeholder="Enter your full name"
                            required
                            aria-describedby="fullName-error"
                        >
                        <div class="error-message" id="fullName-error">
                            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                            <span class="error-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address *</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="Enter your email address"
                            required
                            aria-describedby="email-error"
                        >
                        <div class="error-message" id="email-error">
                            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                            <span class="error-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            class="form-input" 
                            placeholder="Enter your phone number (optional)"
                            aria-describedby="phone-error"
                        >
                        <div class="error-message" id="phone-error">
                            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                            <span class="error-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">
                            Message * 
                            <span class="character-count" id="charCount">(0/500)</span>
                        </label>
                        <textarea 
                            id="message" 
                            name="message" 
                            class="form-textarea" 
                            placeholder="Enter your message here..."
                            required
                            maxlength="500"
                            aria-describedby="message-error"
                        ></textarea>
                        <div class="error-message" id="message-error">
                            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                            <span class="error-text"></span>
                        </div>
                    </div>

                    <button type="submit" class="submit-button" id="submitButton">
                        <div class="loading-spinner"></div>
                        <span class="button-text">Send Message</span>
                        <span class="loading-text">Sending...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Form validation and handling
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const formCard = document.getElementById('formCard');
        const successMessage = document.getElementById('successMessage');
        const charCount = document.getElementById('charCount');
        
        // Field references
        const fields = {
            fullName: document.getElementById('fullName'),
            email: document.getElementById('email'),
            phone: document.getElementById('phone'),
            message: document.getElementById('message')
        };

        // Validation functions
        const validators = {
            fullName: (value) => {
                if (!value.trim()) return 'Full name is required';
                if (value.trim().length < 2) return 'Name must be at least 2 characters';
                if (value.trim().length > 50) return 'Name must be less than 50 characters';
                return null;
            },
            email: (value) => {
                if (!value.trim()) return 'Email is required';
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(value)) return 'Please enter a valid email address';
                return null;
            },
            phone: (value) => {
                if (!value.trim()) return null; // Optional field
                const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
                if (!phoneRegex.test(value.replace(/[\s\-\(\)]/g, ''))) {
                    return 'Please enter a valid phone number';
                }
                return null;
            },
            message: (value) => {
                if (!value.trim()) return 'Message is required';
                if (value.trim().length < 10) return 'Message must be at least 10 characters';
                if (value.trim().length > 500) return 'Message must be less than 500 characters';
                return null;
            }
        };

        // Show/hide error message
        function showError(fieldName, message) {
            const field = fields[fieldName];
            const errorDiv = document.getElementById(`${fieldName}-error`);
            const errorText = errorDiv.querySelector('.error-text');
            
            field.classList.add('error');
            field.setAttribute('aria-invalid', 'true');
            errorText.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError(fieldName) {
            const field = fields[fieldName];
            const errorDiv = document.getElementById(`${fieldName}-error`);
            
            field.classList.remove('error');
            field.setAttribute('aria-invalid', 'false');
            errorDiv.classList.remove('show');
        }

        // Validate single field
        function validateField(fieldName) {
            const value = fields[fieldName].value;
            const error = validators[fieldName](value);
            
            if (error) {
                showError(fieldName, error);
                return false;
            } else {
                hideError(fieldName);
                return true;
            }
        }

        // Validate entire form
        function validateForm() {
            let isValid = true;
            Object.keys(fields).forEach(fieldName => {
                if (!validateField(fieldName)) {
                    isValid = false;
                }
            });
            return isValid;
        }

        // Update character count
        function updateCharCount() {
            const length = fields.message.value.length;
            charCount.textContent = `(${length}/500)`;
        }

        // Add event listeners
        Object.keys(fields).forEach(fieldName => {
            const field = fields[fieldName];
            
            // Clear error on input
            field.addEventListener('input', () => {
                hideError(fieldName);
                if (fieldName === 'message') {
                    updateCharCount();
                }
            });
            
            // Validate on blur
            field.addEventListener('blur', () => {
                validateField(fieldName);
            });
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }

            // Show loading state
            submitButton.classList.add('loading');
            submitButton.disabled = true;

            // Simulate form submission
            try {
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Show success message
                formCard.classList.add('hidden');
                successMessage.classList.add('show');
                
                // Reset form after 4 seconds
                setTimeout(() => {
                    form.reset();
                    updateCharCount();
                    Object.keys(fields).forEach(hideError);
                    
                    // Return to form
                    successMessage.classList.remove('show');
                    formCard.classList.remove('hidden');
                    submitButton.classList.remove('loading');
                    submitButton.disabled = false;
                }, 4000);
                
            } catch (error) {
                console.error('Submission error:', error);
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
            }
        });

        // Initialize character count
        updateCharCount();
    </script>
</body>
</html>
